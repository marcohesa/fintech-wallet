<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}"
>
  <head>
    <title>Iniciar Sesión</title>
  </head>

  <body>
    <div
      layout:fragment="content"
      class="max-w-md mx-auto bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700"
    >
      <h2 class="text-2xl font-bold mb-6 text-center text-white">
        Iniciar Sesión
      </h2>

      <div
        th:if="${param.registered}"
        class="bg-green-500/10 border border-green-500 text-green-400 p-3 rounded mb-4 text-sm text-center"
      >
        ¡Cuenta creada con éxito! Ya puedes iniciar sesión.
      </div>

      <div
        th:if="${param.error}"
        class="bg-red-500/10 border border-red-500 text-red-400 p-3 rounded mb-4 text-sm text-center"
      >
        Correo electrónico o contraseña incorrectos.
      </div>

      <form th:action="@{/auth/login}" method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300"
            >Correo Electrónico</label
          >
          <input
            type="email"
            name="username"
            required
            class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300"
            >Contraseña</label
          >
          <input
            type="password"
            name="password"
            required
            class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-4 rounded-md transition duration-200"
        >
          Ingresar
        </button>
      </form>

      <p class="mt-4 text-center text-sm text-gray-400">
        ¿No tienes cuenta?
        <a href="/auth/register" class="text-indigo-400 hover:underline"
          >Regístrate aquí</a
        >
      </p>
    </div>
  </body>
</html>
