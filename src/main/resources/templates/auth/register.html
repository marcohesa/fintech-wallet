<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}"
>
  <head>
    <title>Registro de Cuenta</title>
  </head>

  <body>
    <div
      layout:fragment="content"
      class="max-w-md mx-auto bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700"
    >
      <h2 class="text-2xl font-bold mb-6 text-center text-white">
        Crear una Cuenta
      </h2>

      <!-- Mensaje de error global si el correo ya existe -->
      <div
        th:if="${errorMessage}"
        class="bg-red-500/10 border border-red-500 text-red-400 p-3 rounded mb-4 text-sm text-center"
      >
        <span th:text="${errorMessage}"></span>
      </div>

      <div id="register-form-container">
        <form
          hx-post="/auth/register"
          hx-target="#register-form-container"
          hx-swap="outerHTML"
          class="space-y-4"
        >
          <div>
            <label class="block text-sm font-medium text-gray-300"
              >Nombre (s)</label
            >
            <input
              type="text"
              name="firstName"
              th:value="${registerDto?.firstName}"
              required
              class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300"
              >Apellidos</label
            >
            <input
              type="text"
              name="lastName"
              th:value="${registerDto?.lastName}"
              required
              class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300"
              >Correo Electrónico</label
            >
            <input
              type="email"
              name="email"
              th:value="${registerDto?.email}"
              required
              class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300"
              >Contraseña</label
            >
            <input
              type="password"
              name="password"
              required
              minlength="8"
              class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-4 rounded-md transition duration-200"
          >
            Registrarse
          </button>
        </form>

        <p class="mt-4 text-center text-sm text-gray-400">
          ¿Ya tienes una cuenta?
          <a href="/auth/login" class="text-indigo-400 hover:underline"
            >Inicia Sesión</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
