<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$CONTENT_TITLE - Fintech Wallet">
      Fintech Wallet
    </title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js  -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans antialiased"
  >
    <nav
      class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center"
    >
      <a
        href="/"
        class="text-2xl font-bold text-indigo-400 flex items-center gap-2"
      >
        <span>Fintech Wallet</span>
      </a>
      <div class="flex items-center space-x-4">
        <span class="text-sm text-gray-400">Demostración Full-Stack</span>
      </div>
    </nav>

    <main id="main-content" class="flex-grow container mx-auto px-4 py-8">
      <div layout:fragment="content">
        <!-- El contenido dinámico HTMX de cada vista se inyectará aquí -->
      </div>
    </main>

    <footer
      class="bg-gray-800 border-t border-gray-700 py-4 text-center text-sm text-gray-400"
    >
      <p>&copy; 2026 Fintech Wallet Monolith. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
